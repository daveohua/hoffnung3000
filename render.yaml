services:
  - type: web
    name: hoffnung3000
    runtime: docker
    region: frankfurt
    plan: starter
    healthCheckPath: /api/health-check
    preDeployCommand: npm run db:migrate
    initialDeployHook: npm run db:seed
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_DIALECT
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: hoffnung3000-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_BUCKET_NAME
        sync: false
      - key: PAYPAL_ID
        sync: false
      - key: PAYPAL_SECRET
        sync: false
      - key: PAYPAL_RETURN_URL
        sync: false
      - key: PAYPAL_CANCEL_URL
        sync: false

databases:
  - name: hoffnung3000-db
    databaseName: hoffnung3000
    user: hoffnung3000
    region: frankfurt
    plan: basic-256mb
